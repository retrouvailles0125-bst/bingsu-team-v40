.wishfall-overlay{background:radial-gradient(ellipse at 50% 45%,#4d245f,#5c2d7b 48%,#231634)!important}.wishfall-sky{min-height:360px}.wishfall-aurora{position:absolute;inset:-25%;background:conic-gradient(from 10deg,#e9abf600,#f9d16d99,#ec83ce99,#a56cf3a3,#fff2aa77,#e9abf600);filter:blur(40px);animation:starWishAurora 3.8s ease-in-out both}.wishfall-star{z-index:3;font-size:90px;animation:starWishFall 3.7s cubic-bezier(.33,.08,.37,.97) forwards!important}.wishfall-trail{z-index:2;animation-duration:3.7s!important}.wishfall-burst{position:absolute;z-index:4;top:55%;left:50%;transform:translate(-50%,-50%) scale(.1);white-space:nowrap;font-size:42px;letter-spacing:12px;color:#fff1a8;text-shadow:0 0 24px #ffb3ed,0 0 60px #ce81ff;opacity:0;animation:starWishBurst 3.7s ease-out forwards}.wishfall-text{z-index:5;color:#fff5d8!important}

@keyframes starWishTwinkle{from{opacity:.25;transform:scale(.75)}to{opacity:1;transform:scale(1.3)}}@keyframes starWishFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}@keyframes starWishAurora{0%{opacity:.15;transform:rotate(0deg) scale(.8)}65%{opacity:.85}100%{opacity:1;transform:rotate(170deg) scale(1.4)}}@keyframes starWishFall{0%{transform:translate(180px,-150px) scale(.35) rotate(-20deg);opacity:0}12%{opacity:1}70%{transform:translate(-35px,250px) scale(1.1) rotate(18deg);opacity:1}83%{transform:translate(-65px,390px) scale(1.6) rotate(45deg);opacity:1}100%{transform:translate(-65px,410px) scale(3.4) rotate(60deg);opacity:0}}@keyframes starWishBurst{0%,70%{opacity:0;transform:translate(-50%,-50%) scale(.1)}84%{opacity:1;transform:translate(-50%,-50%) scale(1.6)}100%{opacity:0;transform:translate(-50%,-50%) scale(3.3)}}

<script>

let selectedProject=null,archiveProject=null,accountProject=null,donateMode=null,donateDraft=null,selectedSpinType='normal';let email=sessionStorage.getItem(USER)||'',admin=sessionStorage.getItem(ADMIN)==='yes',tab='home',spinning=false,angle=0;
const settle=()=>{let changed=false;for(const d of db.donations){if(d.status==='Processing'&&Date.now()>=d.verifyAt){d.status='Verified';d.verifyAt=null;changed=true}}if(changed)localStorage.setItem(KEY,JSON.stringify(db));return changed};const save=()=>localStorage.setItem(KEY,JSON.stringify(db)),uid=()=>crypto.randomUUID?.()||('x'+Date.now()+Math.random().toString(36).slice(2)),ref=()=>('BST-'+Date.now().toString(36).toUpperCase()+'-'+Math.random().toString(36).slice(2,6).toUpperCase()),fmt=d=>new Date(d).toLocaleString('vi-VN');

const hasBlocked=t=>(db.communitySettings.blocked||'').split(/\n|,/).map(x=>x.trim().toLowerCase()).filter(Boolean).some(w=>String(t).replace(/<[^>]*>/g,' ').toLowerCase().includes(w));const richSafe=html=>{const doc=new DOMParser().parseFromString(html||'','text/html');const allowed=new Set(['B','STRONG','I','EM','U','S','BR','DIV','P','SPAN','FONT','UL','OL','LI']);function clean(node){for(const ch of [...node.childNodes]){if(ch.nodeType===8){ch.remove();continue}if(ch.nodeType===3)continue;if(ch.nodeType!==1){ch.remove();continue}if(!allowed.has(ch.tagName)){ch.replaceWith(...ch.childNodes);continue}for(const a of [...ch.attributes]){if(a.name!=='style'&&!(ch.tagName==='FONT'&&a.name==='color'))ch.removeAttribute(a.name)}if(ch.hasAttribute('style')){const color=ch.style.color,align=ch.style.textAlign;ch.removeAttribute('style');if(/^(#[0-9a-f]{3,8}|rgb\(\s*\d{1,3}\s*,\s*\d{1,3}\s*,\s*\d{1,3}\s*\))$/i.test(color))ch.style.color=color;if(ch.tagName==='FONT'){const fc=ch.getAttribute('color')||'';ch.removeAttribute('color');if(/^#[0-9a-f]{6}$/i.test(fc))ch.style.color=fc;}if(['left','center','right'].includes(align))ch.style.textAlign=align}clean(ch)}}clean(doc.body);return doc.body.innerHTML};

async function hashPassword(em,pass){const bytes=new TextEncoder().encode(em+'|'+pass);if(globalThis.crypto?.subtle){const digest=await crypto.subtle.digest('SHA-256',bytes);return Array.from(new Uint8Array(digest)).map(x=>x.toString(16).padStart(2,'0')).join('')}let h=2166136261;for(const b of bytes){h^=b;h=Math.imul(h,16777619)}return 'demo-'+(h>>>0).toString(16)}

async function prepareDonateBill(file){
 const allowed=['image/jpeg','image/png','image/webp','application/pdf'];
 if(!allowed.includes(file.type))throw Error('Chỉ hỗ trợ JPG, PNG, WebP hoặc PDF.');
 if(file.type==='application/pdf'&&file.size>500*1024)throw Error('PDF vượt 500 KB; vui lòng nén PDF trước khi gửi.');
 const read=f=>new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(Error('Không đọc được tệp'));r.readAsDataURL(f)});
 if(file.size<=400*1024)return {name:file.name,type:file.type,data:await read(file)};
 if(file.type==='application/pdf')return {name:file.name,type:file.type,data:await read(file)};
 const url=URL.createObjectURL(file);
 try{
  const img=await new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=()=>reject(Error('Ảnh bill không hợp lệ'));i.src=url});
  const canvas=document.createElement('canvas');let scale=Math.min(1,1600/Math.max(img.width,img.height));
  for(let attempt=0;attempt<6;attempt++){
   canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));
   const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);
   const data=canvas.toDataURL('image/jpeg',Math.max(.42,.83-attempt*.08));
   if(data.length<560000)return {name:file.name.replace(/\.[^.]+$/, '')+'.jpg',type:'image/jpeg',data};
   scale*=.78;
  }
  throw Error('Ảnh quá lớn, vui lòng chụp hoặc cắt ảnh nhỏ hơn.');
 }finally{URL.revokeObjectURL(url)}
}

ength?`<h3>Danh sách Offer (${t.offers.length})</h3>${t.offers.map(o=>{const gs=(o.giftIds||[o.giftId]).map(gift).filter(Boolean);return `<div class="trade-offer-row"><span><b>👤 ${esc(name(o.offerer))}</b> đề nghị <b>${gs.length} quà</b><div class="trade-offer-gifts">${gs.map(g=>`<span class="rarity-pill">🎀 ${esc(g.giftName)} · ${esc(g.rarity||'Thường')} · ${esc(g.code)}</span>`).join('')}</div><small>Gửi: ${fmt(o.createdAt)}</small><br><small>Trạng thái: ${o.status==='Accepted'?'Đã đồng ý':o.status==='Rejected'?'Đã từ chối':'Chờ quyết định'}${o.decidedAt?' · '+fmt(o.decidedAt):''}</small></span>${isOwner&&!done&&o.status==='Pending'?`<button data-accept="${esc(t.id)}|${esc(o.id)}">Đồng ý</button><button class="secondary" data-reject="${esc(t.id)}|${esc(o.id)}">Từ chối</button>`:''}</div>`}).join('')}`:''}</div></details></div>`}).join('')||'<p class="muted">Chưa có bài Trade.</p>'}</section>`;
document.querySelectorAll('[data-trade-tab]').forEach(b=>b.onclick=()=>{tradeSubtab=b.dataset.tradeTab;updateTradeTabs()});function updateTradeTabs(){document.querySelectorAll('[data-trade-panel]').forEach(p=>p.classList.toggle('hidden',p.dataset.tradePanel!==tradeSubtab));document.querySelectorAll('[data-trade-tab]').forEach(b=>b.classList.toggle('selected',b.dataset.tradeTab===tradeSubtab))}updateTradeTabs();
let exchangeView='open';const updateExchangeView=()=>{const rawDate=document.querySelector('#exchangeOfferDate')?.value.trim()||'';const date=rawDate;document.querySelectorAll('[data-exchange-view]').forEach(b=>b.classList.toggle('selected',b.dataset.exchangeView===exchangeView));document.querySelectorAll('[data-exchange-status]').forEach(card=>{const matchesStatus=card.dataset.exchangeStatus===exchangeView;const dates=(card.dataset.offerDates||'').split(',');card.classList.toggle('hidden',!matchesStatus||(date&&!dates.includes(date)))});const host=document.querySelector('.trade-market');if(host){const visible=[...host.querySelectorAll('[data-exchange-status]')].filter(x=>!x.classList.contains('hidden')).length;let empty=host.querySelector('.exchange-empty');if(!empty){empty=document.createElement('p');empty.className='exchange-empty muted';host.appendChild(empty)}empty.textContent=date?'Không có bài Trade có offer trong ngày đã chọn.':exchangeView==='open'?'Chưa có bài đang nhận Offer.':'Chưa có bài Trade hoàn tất.';empty.classList.toggle('hidden',visible>0)}};document.querySelectorAll('[data-exchange-view]').forEach(b=>b.onclick=()=>{exchangeView=b.dataset.exchangeView;updateExchangeView()});const offerDateFilter=document.querySelector('#exchangeOfferDate');if(offerDateFilter)offerDateFilter.onchange=updateExchangeView;const clearOfferDate=document.querySelector('#clearExchangeDate');if(clearOfferDate)clearOfferDate.onclick=()=>{offerDateFilter.value='';updateExchangeView()};updateExchangeView();
$('#tradeModeBtn').onclick=()=>{$('#giftSendArea').classList.add('hidden');$('#tradePostArea').classList.remove('hidden');$('#tradeModeBtn').classList.add('selected');$('#giftModeBtn').classList.remove('selected')};$('#giftModeBtn').onclick=()=>{$('#giftSendArea').classList.remove('hidden');$('#tradePostArea').classList.add('hidden');$('#giftModeBtn').classList.add('selected');$('#tradeModeBtn').classList.remove('selected')};$('#sendGift').onsubmit=e=>{e.preventDefault();const item=gift($('#giftToSend').value),to=$('#giftRecipient').value.trim().toLowerCase();if(!item||item.owner!==email||reserved(item.id)||db.giftTransfers.some(t=>t.giftId===item.id&&t.status==='Pending'))return alert('Quà đang được giữ hoặc không hợp lệ');if(to===email||!accounts[to])return alert('Email người nhận phải là tài khoản đã đăng ký và khác bạn');if(!confirm(`Tặng ${item.giftName} cho ${to}?`))return;db.giftTransfers.push({id:uid(),giftId:item.id,giftName:item.giftName,from:email,to,status:'Pending',date:new Date().toISOString()});save();render()};document.querySelectorAll('[data-gift-accept]').forEach(b=>b.onclick=()=>{const t=db.giftTransfers.find(x=>x.id===b.dataset.giftAccept),item=gift(t?.giftId);if(!t||t.to!==email||t.status!=='Pending'||item?.owner!==t.from)return alert('Quà không còn khả dụng');if(!confirm(`Đồng ý nhận ${item.giftName} từ ${t.from}?`))return;item.owner=email;item.tradeHistory??=[];item.tradeHistory.push({date:new Date().toISOString(),otherGift:'TẶNG QUÀ',with:t.from});t.status='Accepted';t.completedAt=new Date().toISOString();save();render()});document.querySelectorAll('[data-gift-reject]').forEach(b=>b.onclick=()=>{const t=db.giftTransfers.find(x=>x.id===b.dataset.giftReject);if(!t||t.to!==email||t.status!=='Pending')return;t.status='Rejected';t.completedAt=new Date().toISOString();save();render()});
document.querySelectorAll('[data-trade-reply]').forEach(f=>f.onsubmit=e=>{e.preventDefault();const t=db.trades.find(x=>x.id===f.dataset.tradeReply);if(!t||t.status==='Deleted'||t.status==='Completed'||!email)return;const value=f.elements.reply.value.trim();if(!value)return;if(hasBlocked(value))return alert('Lời nhắn chứa từ không được phép');t.replies??=[];t.replies.push({id:uid(),email,text:value,date:new Date().toISOString()});save();render()});
$('#postTrade').onclick=()=>{const x=gift($('#postGift').value);if(!x||x.owner!==email||reserved(x.id))return alert('Quà không hợp lệ');db.trades.push({id:uid(),giftId:x.id,owner:email,status:'Open',intro:$('#tradeIntro').value.trim(),offers:[],rejections:[],createdAt:new Date().toISOString()});save();render()};
document.querySelectorAll('[data-offer]').forEach(b=>b.onclick=()=>{const t=db.trades.find(t=>t.id===b.dataset.offer);if(!t||t.status==='Completed'||t.status==='Deleted'||t.owner===email)return;const ids=[...document.querySelectorAll('[id="offer-'+t.id+'"] input:checked')].map(el=>el.value);const xs=ids.map(gift);if(!xs.length)return alert('Hãy chọn ít nhất 1 món quà để Offer');if(xs.some(x=>!x||x.owner!==email||reserved(x.id)))return alert('Có quà không hợp lệ hoặc đang được giữ cho Offer khác');if(!confirm(`Bạn muốn đề nghị đổi ${xs.length} món (${xs.map(x=>x.giftName).join(', ')}) lấy ${gift(t.giftId)?.giftName}?`))return;t.offers.push({id:uid(),giftId:ids[0],giftIds:ids,offerer:email,createdAt:new Date().toISOString(),status:'Pending',decidedAt:null});t.status='Open';save();render()});
document.querySelectorAll('[data-accept]').forEach(b=>b.onclick=()=>{const [tid,oid]=b.dataset.accept.split('|'),t=db.trades.find(t=>t.id===tid),o=t?.offers.find(o=>o.id===oid);if(!t||t.owner!==email||t.status==='Completed'||t.status==='Deleted'||o?.status!=='Pending')return;const a=gift(t.giftId),cs=(o.giftIds||[o.giftId]).map(gift);if(!a||!cs.length||a.owner!==t.owner||cs.some(c=>!c||c.owner!==o.offerer))return alert('Quà không còn hợp lệ');if(!confirm(`Đồng ý đổi ${a.giftName} lấy ${cs.length} món (${cs.map(c=>c.giftName).join(', ')}) của ${name(o.offerer)}? Toàn bộ ${cs.length} món sẽ chuyển sang bạn. Các offer khác bị từ chối.`))return;const date=new Date().toISOString();a.owner=o.offerer;a.tradeHistory??=[];a.tradeHistory.push({tradeId:t.id,date,otherGift:cs.map(c=>c.giftName).join(' + '),with:o.offerer});cs.forEach(c=>{c.owner=t.owner;c.tradeHistory??=[];c.tradeHistory.push({tradeId:t.id,date,otherGift:a.giftName,with:t.owner})});o.status='Accepted';o.decidedAt=date;t.offers.filter(z=>z.id!==o.id&&z.status==='Pending').forEach(z=>{z.status='Rejected';z.decidedAt=date;z.reason='Offer khác đã được chấp nhận'});t.offerer=o.offerer;t.offerGiftId=o.giftId;t.offerGiftIds=o.giftIds||[o.giftId];t.offeredAt=o.createdAt;t.completedOfferName=cs.map(c=>c.giftName).join(' + ');t.status='Completed';t.completedAt=date;save();render()});
document.querySelectorAll('[data-reject]').forEach(b=>b.onclick=()=>{const [tid,oid]=b.dataset.reject.split('|'),t=db.trades.find(t=>t.id===tid),o=t?.offers.find(o=>o.id===oid);if(!t||t.owner!==email||o?.status!=='Pending')return;if(!confirm('Từ chối Offer này? Bài đăng vẫn tiếp tục nhận Offer.'))return;o.status='Rejected';o.decidedAt=new Date().toISOString();o.reason='Chủ bài đăng từ chối';save();render()});
document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{const t=db.trades.find(t=>t.id===b.dataset.delete);if(!t||t.owner!==email||t.status==='Completed'||t.status==='Deleted')return;if(!confirm('Xóa bài Trade? Các Offer đang chờ sẽ bị từ chối.'))return;const date=new Date().toISOString();t.offers.filter(o=>o.status==='Pending').forEach(o=>{o.status='Rejected';o.decidedAt=date;o.reason='Bài đăng đã bị xóa'});t.status='Deleted';t.deletedAt=date;save();render()})}
function adminPage(){if(!admin){$('#app').innerHTML=`<section class="panel"><h2>ĐĂNG NHẬP BINGSU TEAM</h2><p class="note">Mật khẩu demo chỉ để thử giao diện, không bảo vệ dữ liệu thật.</p><form id="adminLogin"><label>Mật khẩu demo</label><input id="pass" type="password" required><p><button>Vào trang quản trị</button></p></form></section>`;$('#adminLogin').onsubmit=e=>{e.preventDefault();if($('#pass').value!=='BST2026')return alert('Sai mật khẩu demo');admin=true;sessionStorage.setItem(ADMIN,'yes');render()};return}
$('#app').innerHTML=`<section class="panel"><div class="row"><h2>BINGSU TEAM · QUẢN LÝ HỆ THỐNG</h2><button class="secondary" id="adminLogout">Đăng xuất</button></div><p class="note">Đây là demo lưu dữ liệu trong localStorage. Kết quả chỉ đồng bộ giữa các tab cùng trình duyệt, chưa đồng bộ giữa thiết bị/người dùng khác nhau.</p><p class="muted">Trong thời gian chờ, BST có thể sửa hoặc hủy xác minh. Sau khi hết hạn, trạng thái và lượt quay mới được cập nhật.</p><p class="muted">Sau Verified, User tự chọn toàn bộ lượt thường hoặc số Gold tối đa cộng lượt thường từ phần tiền dư. Số lượt = phần nguyên của (số tiền thực nhận / tỷ lệ). Thay đổi tỷ lệ chỉ áp dụng khi xác minh các giao dịch tiếp theo.</p></section><section class="panel"><h2>QUẢN LÝ TÀI KHOẢN USER</h2><p class="muted">Danh sách tài khoản đăng ký trên trình duyệt này. Mật khẩu gốc không thể xem lại: hệ thống chỉ lưu mã băm. Đây là bản demo, không đồng bộ tài khoản từ thiết bị khác.</p><div class="scroll"><table><thead><tr><th>EMAIL</th><th>ID HIỂN THỊ</th><th>MẬT KHẨU</th><th>ĐĂNG NHẬP</th><th>THÔNG BÁO KHI BỊ CHẶN</th><th>THAO TÁC</th></tr></thead><tbody>${Object.keys(accounts).sort().map(em=>`<tr><td>${esc(em)}</td><td>${esc(displayName(em))}</td><td><span class="muted" title="Chỉ lưu mã băm, không thể xem mật khẩu gốc">Đã đặt · bảo mật</span></td><td><span class="${db.loginBlocks[em]?.blocked?'pending':'ok'}">${db.loginBlocks[em]?.blocked?'ĐÃ CHẶN':'HOẠT ĐỘNG'}</span></td><td><textarea class="block-message" data-block-message="${esc(em)}" rows="3" placeholder="Nhập thông báo hiển thị khi user đăng nhập lại...">${esc(db.loginBlocks[em]?.message||'')}</textarea></td><td><button type="button" class="${db.loginBlocks[em]?.blocked?'secondary':''}" data-toggle-login="${esc(em)}">${db.loginBlocks[em]?.blocked?'MỞ CHẶN':'CHẶN LOGIN'}</button><button type="button" class="secondary" data-save-login-message="${esc(em)}">LƯU THÔNG BÁO</button></td></tr>`).join('')||'<tr><td colspan="6">Chưa có tài khoản trên trình duyệt này.</td></tr>'}</tbody></table></div></section><section class="panel"><h2>CÀI ĐẶT VÒNG XOAY</h2><div class="row"><div><label>Số VND cho 1 lượt quay</label><input type="text" inputmode="numeric" data-money id="rate" value="${Number(db.rate).toLocaleString('vi-VN')}"></div><div><label>VND / 1 lượt Gold</label><input type="text" inputmode="numeric" data-money id="goldRate" value="${Number(db.goldRate).toLocaleString('vi-VN')}"></div><button id="saveRate">Lưu tỷ lệ</button></div><p class="muted">Thời gian cho mỗi lượt, áp dụng cả khi quay liên tiếp nhiều lượt.</p><div class="row"><div><label>GIÂY / LƯỢT (5–10 GIÂY)</label><input id="spinSeconds" type="number" min="5" max="10" step="1" value="${db.spinSeconds}"></div><button id="saveSpinSeconds">LƯU THỜI GIAN QUAY</button></div></section><section class="panel"><h2>KHAI BÁO DONATE</h2><p class="muted">BST quyết định trường nào hiển thị và lời nhắn nào được công khai. Người Donate không tự chọn quyền công khai. Email, số điện thoại và bill không được công khai để bảo vệ thông tin cá nhân. ID và số tiền bắt buộc cho quy trình QR.</p><div class="scroll"><table><thead><tr><th>THÔNG TIN</th><th>HIỂN THỊ TRÊN FORM</th><th>CÔNG KHAI</th><th>THAO TÁC</th></tr></thead><tbody>${[['nick','ID HIỂN THỊ'],['phone','SỐ ĐIỆN THOẠI'],['amount','SỐ TIỀN DONATE'],['transferDate','NGÀY CHUYỂN KHOẢN'],['kandeeMessage','LỜI NHẮN CHO CÁC BẠN KANDEE'],['bstMessage','LỜI NHẮN DÀNH CHO BINGSU TEAM']].filter(([key])=>!db.donateFields[key]?.deleted).map(([key,label])=>`<tr><td><input class="field-label-edit" data-field-label="${key}" value="${esc(db.donateLabels[key]||label)}" maxlength="90"></td><td><input type="checkbox" data-field-show="${key}" ${db.donateFields[key]?.show!==false?'checked':''}  style="width:auto"></td><td><input type="checkbox" data-field-public="${key}" ${db.donateFields[key]?.public?'checked':''} ${['phone'].includes(key)?'disabled title="Thông tin riêng tư"':''} style="width:auto"></td><td>${['nick','amount'].includes(key)?'<span class="muted">BẮT BUỘC</span>':`<button type="button" class="secondary" data-disable-default="${key}">XÓA</button>`}</td></tr>`).join('')}</tbody></table></div><div class="bill-count-config"><h3>BILL CHUYỂN KHOẢN · BẮT BUỘC</h3><p class="muted">Mỗi lượt Donate phải tải ít nhất một bill. BST có thể điều chỉnh số bill tối đa.</p><label>SỐ BILL TỐI ĐA MỖI LẦN DONATE</label><input type="number" id="maxDonateBills" min="1" max="20" step="1" value="${db.maxDonateBills}"></div><p><button id="saveDonateFields">LƯU CẤU HÌNH KHAI BÁO</button></p><h3>KHÔI PHỤC TRƯỜNG ĐÃ XÓA</h3><div class="row">${[['phone','SỐ ĐIỆN THOẠI'],['transferDate','NGÀY CHUYỂN KHOẢN'],['kandeeMessage','LỜI NHẮN CHO CÁC BẠN KANDEE'],['bstMessage','LỜI NHẮN DÀNH CHO BINGSU TEAM']].filter(([k])=>db.donateFields[k]?.deleted).map(([k,label])=>`<button type="button" class="secondary" data-restore-field="${k}">+ ${label}</button>`).join('')||'<span class="muted">KHÔNG CÓ TRƯỜNG ĐÃ XÓA</span>'}</div><h3>KHỞI TẠO THÔNG TIN KHAI BÁO MỚI</h3><form id="createDonateField"><div class="grid"><div><label>TÊN THÔNG TIN</label><input id="newFieldLabel" maxlength="90" required></div><div><label>KIỂU DỮ LIỆU</label><select id="newFieldType"><option value="text">VĂN BẢN</option><option value="textarea">LỜI NHẮN DÀI</option><option value="number">SỐ</option><option value="date">NGÀY</option></select></div><div><label><input type="checkbox" id="newFieldRequired" style="width:auto"> BẮT BUỘC NHẬP</label></div><div><label><input type="checkbox" id="newFieldPublic" style="width:auto"> CÔNG KHAI TRÊN THEO DÕI DONATE</label></div></div><p><button>+ KHỞI TẠO & LƯU THÔNG TIN</button></p></form><h3>THÔNG TIN ĐÃ KHỞI TẠO</h3><div class="scroll"><table><thead><tr><th>TÊN</th><th>KIỂU</th><th>BẮT BUỘC</th><th>CÔNG KHAI</th><th>HIỂN THỊ</th><th>THAO TÁC</th></tr></thead><tbody>${db.customDonateFields.map(f=>`<tr><td>${esc(f.label)}</td><td>${esc(f.type)}</td><td>${f.required?'CÓ':'KHÔNG'}</td><td><input type="checkbox" data-custom-public="${esc(f.id)}" ${f.public?'checked':''} style="width:auto"></td><td><input type="checkbox" data-custom-show="${esc(f.id)}" ${f.show?'checked':''} style="width:auto"></td><td><button type="button" class="secondary" data-custom-delete="${esc(f.id)}">XÓA</button></td></tr>`).join('')||'<tr><td colspan="6">CHƯA CÓ THÔNG TIN MỚI</td></tr>'}</tbody></table></div><p><button id="saveCustomFields">LƯU THAY ĐỔI THÔNG TIN</button></p></section><section class="panel"><h2>LỜI NHẮN CỦA KANDEE</h2><p class="muted">Lọc theo project và loại lời nhắn. Nội dung riêng tư chỉ hiển thị trong quản trị BST.</p><div class="grid"><div><label>PROJECT</label><select id="messageProject"><option value="all">TẤT CẢ PROJECT</option>${db.projects.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}</select></div><div><label>LOẠI LỜI NHẮN</label><select id="messageType"><option value="all">TẤT CẢ LỜI NHẮN</option><option value="kandee">CHO CÁC BẠN KANDEE</option><option value="bst">CHO BINGSU TEAM</option></select></div></div><div id="adminKandeeMessages"></div></section><section class="panel"><h2>Đối soát Donate</h2><div class="row"><div><label>Thời gian chờ trước khi công bố xác minh (phút)</label><input id="verifyDelay" type="number" min="0" max="10080" step="1" value="${db.verifyDelay}"></div><button id="saveDelay">Lưu thời gian</button></div><div class="row export-toolbar"><div><label>Xuất dữ liệu Project</label><select id="reconcileProject"><option value="all">Tất cả Project</option>${db.projects.map(p=>`<option value="${esc(p.id)}">${esc(p.name)} · ${p.open?'Đang mở':'Đã đóng'}</option>`).join('')}</select></div><button id="exportReconcile">📥 Xuất Excel · Đối soát</button></div><div class="scroll"><table><thead><tr><th>REFERENCE / PROJECT / EMAIL / ID</th><th>THÔNG TIN KHAI BÁO</th><th>KHAI BÁO</th><th>Thực nhận (VND)</th><th>Trạng thái</th><th>LƯỢT</th><th>THAO TÁC</th></tr></thead><tbody>${db.donations.slice().reverse().map(d=>`<tr data-reconcile-row="${esc(d.projectId)}"><td><b>${esc(d.ref)}</b><br><small>Project: ${esc(db.projects.find(p=>p.id===d.projectId)?.name||"—")}</small><br>${esc(d.email)}<br>${esc(d.nick)}<br><small>SĐT: ${esc(d.phone||"—")} · ${esc(d.note)}</small></td><td><div class="reconcile-details"><div><b>NGÀY KHAI BÁO:</b> ${fmt(d.date)}</div><div><b>NGÀY CHUYỂN:</b> ${esc(d.transferDate||'—')}</div><div><b>GHI CHÚ:</b> ${esc(d.note||'—')}</div><div><b>HÌNH THỨC:</b> ${d.viaQR?'QR':'ĐÃ CHUYỂN KHOẢN'}</div><div><b>BILL:</b> ${(d.bills?.length?d.bills:(d.bill?[d.bill]:[])).map((f,i)=>`<a href="${esc(f.data)}" download="${esc(f.name||'bill')}" style="display:inline-block;margin:3px 8px 3px 0">XEM BILL ${i+1} ↗</a>`).join('')||'CHƯA CÓ'}</div>${db.customDonateFields.map(f=>`<div><b>${esc(f.label)}:</b> ${esc(d.extras?.[f.id]||'—')}</div>`).join('')}</div></td><td>${money(d.claimed)}</td><td>${d.status==='Verified'?money(d.actual):`<input style="min-width:145px" type="number" min="0" step="1" id="actual-${d.id}" value="${d.actual??''}" placeholder="Nhập thực nhận">`}</td><td>${d.status==='Processing'?`Processing<br><small data-countdown="${d.id}">${Math.max(0,Math.ceil((d.verifyAt-Date.now())/1000))} giây</small>`:d.status}</td><td>${d.status==='Verified'?d.tickets:0}</td><td>${d.status==='Pending'?`<button data-verify="${d.id}">Verify</button>`:d.status==='Processing'?`<button data-verify="${d.id}">Sửa & đặt lại giờ</button> <button class="secondary" data-cancel="${d.id}">Hủy</button>`:'<span class="ok">✓ Đã xác minh</span>'}</td></tr>`).join('')||'<tr><td colspan="7">Chưa có donate</td></tr>'}</tbody></table></div></section><section class="panel"><h2>THEO DÕI & TẶNG LƯỢT QUAY USER</h2><div class="row export-toolbar"><div><label>CHỌN USER ĐỂ XUẤT</label><select id="spinExportUser"><option value="all">TẤT CẢ USER</option>${[...new Set([...Object.keys(accounts),...db.donations.map(d=>d.email),...db.spins.map(x=>x.email),...(db.bonusSpins||[]).map(b=>b.email)])].sort().map(e=>`<option value="${esc(e)}">${esc(e)}</option>`).join('')}</select></div><button id="exportUserSpins">📥 XUẤT EXCEL LƯỢT QUAY</button></div><div class="admin-spin-table scroll"><table><thead><tr><th>USER</th><th>ĐÃ NHẬN THƯỜNG</th><th>ĐÃ NHẬN GOLD</th><th>ĐÃ QUAY THƯỜNG</th><th>ĐÃ QUAY GOLD</th><th>CÒN LẠI</th></tr></thead><tbody>${[...new Set([...Object.keys(accounts),...db.donations.map(d=>d.email),...db.spins.map(x=>x.email),...(db.bonusSpins||[]).map(b=>b.email)])].sort().map(e=>{const ds=db.donations.filter(d=>d.email===e&&d.status==='Verified'&&d.allocated),bn=(db.bonusSpins||[]).filter(x=>x.email===e),n=ds.reduce((a,d)=>a+(d.allocation?.normal||0),0)+bn.filter(x=>x.type==='normal').reduce((a,x)=>a+x.qty,0),g=ds.reduce((a,d)=>a+(d.allocation?.gold||0),0)+bn.filter(x=>x.type==='gold').reduce((a,x)=>a+x.qty,0),un=db.spins.filter(x=>x.email===e&&(x.spinType||'normal')==='normal').length,ug=db.spins.filter(x=>x.email===e&&x.spinType==='gold').length;return `<tr><td>${esc(e)}</td><td>${n}</td><td>${g}</td><td>${un}</td><td>${ug}</td><td>${Math.max(0,n-un)+Math.max(0,g-ug)}</td></tr>`}).join('')||'<tr><td colspan="6">CHƯA CÓ USER</td></tr>'}</tbody></table></div><h3>TẶNG THÊM LƯỢT QUAY</h3><form id="grantSpins"><div class="grid"><div><label>EMAIL USER</label><input type="email" id="grantEmail" list="userEmails" required><datalist id="userEmails">${[...new Set([...Object.keys(accounts),...db.donations.map(d=>d.email)])].map(e=>`<option value="${esc(e)}">`).join('')}</datalist></div><div><label>LOẠI LƯỢT</label><select id="grantType"><option value="normal">THƯỜNG</option><option value="gold">GOLD</option></select></div><div><label>SỐ LƯỢT TẶNG</label><input id="grantQty" type="number" min="1" max="10000" step="1" required></div><div><label>LÝ DO</label><input id="grantReason" maxlength="150" placeholder="Quà tặng từ BST"></div></div><p><button>TẶNG LƯỢT QUAY</button></p></form><h3>LỊCH SỬ TẶNG LƯỢT</h3><div class="scroll"><table><thead><tr><th>THỜI GIAN</th><th>USER</th><th>LOẠI</th><th>SỐ LƯỢT</th><th>LÝ DO</th></tr></thead><tbody>${(db.bonusSpins||[]).slice().reverse().map(b=>`<tr><td>${fmt(b.date)}</td><td>${esc(b.email)}</td><td>${b.type==='gold'?'GOLD':'THƯỜNG'}</td><td>${b.qty}</td><td>${esc(b.reason||'—')}</td></tr>`).join('')||'<tr><td colspan="5">CHƯA TẶNG LƯỢT</td></tr>'}</tbody></table></div></section><section class="panel"><h2>CẤU HÌNH QR NGÂN HÀNG NHẬN DONATE</h2><p class="muted">Thêm link ảnh QR có sẵn, hoặc thêm tài khoản nhận Donate. Không yêu cầu nhập mã BIN.</p><div class="grid">${db.banks.map(b=>`<div class="metric"><strong>${esc(b.name||'QR CHUYỂN KHOẢN')}</strong><p>${esc(b.holder||'')} ${esc(b.account||'')}</p>${b.qrUrl?`<img src="${esc(b.qrUrl)}" alt="Ảnh QR" style="max-width:170px;width:100%;border-radius:12px">`:''}<p><button class="secondary" data-bank-active="${esc(b.id)}">${b.active?'✓ ĐANG DÙNG':'CHỌN LÀM MẶC ĐỊNH'}</button> <button class="secondary" data-bank-remove="${esc(b.id)}">XÓA</button></p></div>`).join('')||'<p class="muted">CHƯA CÓ THÔNG TIN NHẬN DONATE</p>'}</div><div class="grid"><div class="metric"><h3>1 · THÊM LINK ẢNH QR</h3><form id="addQrImage"><label>LINK ẢNH QR (HTTPS)</label><input id="bankQrUrl" type="url" placeholder="https://..." required><label>TÊN HIỂN THỊ</label><input id="bankQrLabel" placeholder="QR DONATE BST" required><p><button>THÊM ẢNH QR</button></p></form></div><div class="metric"><h3>2 · THÊM TÀI KHOẢN DONATE</h3><form id="addBank"><label>NGÂN HÀNG</label><select id="bankName"><option value="Techcombank">TECHCOMBANK</option><option value="Vietcombank">VIETCOMBANK</option></select><label>SỐ TÀI KHOẢN</label><input id="bankAccount" required pattern="[0-9]{5,25}"><label>TÊN CHỦ TÀI KHOẢN</label><input id="bankHolder" required><p><button>THÊM TÀI KHOẢN DONATE</button></p></form></div></div></section><section class="panel"><h2>Quản lý Project Donate</h2><div class="export-inline"><button class="secondary" data-export-section="projects">📥 Xuất Project (.xlsx)</button></div><p class="muted">Project đang mở sẽ xuất hiện ngay trên trang chủ. Có thể đóng project để ngừng nhận khai báo mới mà không xóa lịch sử.</p><div id="projectRows">${db.projects.map(p=>`<div class="gift"><span><b>${esc(p.name)}</b><br><small>${esc(p.description||"")}</small></span><label><input type="checkbox" data-project-open="${esc(p.id)}" ${p.open?"checked":""} style="width:auto"> Đang mở</label></div>`).join('')}</div><p><button id="saveProjects">Lưu trạng thái Project</button></p><form id="addProject"><div class="grid"><div><label>Tên Project mới</label><input id="newProjectName" required maxlength="100"></div><div><label>Mô tả</label><input id="newProjectDesc" maxlength="250"></div></div><p><button>+ Thêm Project</button></p></form></section><section class="panel"><h2>Xác suất trúng quà theo độ hiếm</h2><div class="export-inline"><button class="secondary" data-export-section="odds">📥 Xuất xác suất (.xlsx)</button></div><p class="muted">Thiết lập phần trăm cho từng loại lượt quay. Tổng mỗi hàng phải đúng 100%. Đặt 0% để loại trừ độ hiếm đó (ví dụ Gold không ra quà Thường).</p><div class="scroll"><table><thead><tr><th>Loại lượt</th><th>Thường (A)</th><th>Rare (R)</th><th>Super Rare (SSR)</th><th>Secret</th><th>Tổng</th></tr></thead><tbody>${['normal','gold'].map(type=>`<tr><th>${type==='gold'?'Gold':'Thường'}</th>${['Thường','Rare','Super Rare','Secret'].map((r,i)=>`<td><input style="min-width:78px" type="number" min="0" max="100" step="1" id="odds-${type}-${i}" value="${db.rarityOdds[type][r]||0}"></td>`).join('')}<td>100%</td></tr>`).join('')}</tbody></table></div><p><button id="saveOdds">Lưu xác suất</button></p><p class="note">Nếu một độ hiếm đã hết quà, hệ thống phân bổ lại xác suất cho các độ hiếm còn quà và có tỷ lệ lớn hơn 0. Xác suất là theo nhóm độ hiếm, không phải theo từng món.</p></section><section class="panel"><h2>THEO DÕI TRADE GIFT</h2><div class="export-inline"><button class="secondary" data-export-section="trade">📥 Xuất Trade (.xlsx)</button></div><p class="muted">Bao gồm cả bài đã Trade, offer bị từ chối và bài do người đăng xóa. Thời gian xử lý tính từ lúc gửi offer đến lúc chấp nhận hoặc từ chối.</p><div class="scroll"><table><thead><tr><th>Người đăng</th><th>Quà đăng</th><th>Người offer</th><th>Quà offer</th><th>Trạng thái</th><th>Gửi offer</th><th>Đồng ý</th><th>Thời gian xử lý</th></tr></thead><tbody>${db.trades.slice().reverse().flatMap(t=>(t.offers||[]).map(o=>{const a=db.spins.find(x=>x.id===t.giftId),b=db.spins.find(x=>x.id===o.giftId);const dur=o.decidedAt?Math.round((new Date(o.decidedAt)-new Date(o.createdAt))/60000)+' phút':'—';return `<tr><td>${esc(t.owner)}</td><td>${esc(a?.giftName||'—')}</td><td>${esc(o.offerer)}</td><td>${esc(b?.giftName||'—')}</td><td>${esc(o.status)}</td><td>${fmt(o.createdAt)}</td><td>${o.decidedAt?fmt(o.decidedAt):'—'}</td><td>${dur}</td></tr>`})).join('')||'<tr><td colspan="8">Chưa có giao dịch Trade</td></tr>'}</tbody></table></div><h3>Lịch sử offer bị từ chối</h3><div class="scroll"><table><thead><tr><th>Bài Trade</th><th>Người gửi</th><th>Quà đã offer</th><th>Thời gian từ chối</th></tr></thead><tbody>${db.trades.flatMap(t=>(t.offers||[]).filter(o=>o.status==='Rejected').map(r=>`<tr><td>${esc(t.id)}</td><td>${esc(r.offerer)}</td><td>${esc(db.spins.find(x=>x.id===r.giftId)?.giftName||'—')}</td><td>${fmt(r.decidedAt||r.createdAt)}</td></tr>`)).join('')||'<tr><td colspan="4">Chưa có offer bị từ chối</td></tr>'}</tbody></table></div></section><section class="panel"><h2>THEO DÕI TẶNG GIFT</h2><p class="muted">Theo dõi yêu cầu tặng, người gửi, người nhận và thời điểm người nhận xác nhận.</p><button type="button" id="exportGiftTransfers" class="secondary">XUẤT EXCEL TẶNG GIFT</button><div class="scroll"><table><thead><tr><th>MÃ QUÀ</th><th>TÊN QUÀ</th><th>NGƯỜI TẶNG</th><th>NGƯỜI NHẬN</th><th>TRẠNG THÁI</th><th>NGÀY GỬI</th><th>NGÀY XỬ LÝ</th></tr></thead><tbody>${(db.giftTransfers||[]).slice().reverse().map(t=>`<tr><td>${esc(db.spins.find(x=>x.id===t.giftId)?.code||'—')}</td><td>${esc(t.giftName||db.sp function exportAdminWorkbook(filename,sheets){
 const wb=typeof XLSX!=='undefined'?XLSX.utils.book_new():null;
 if(wb){sheets.forEach(([name,rows])=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),name));XLSX.writeFile(wb,filename+'.xlsx');return}
 const rows=sheets.flatMap(([name,data])=>[[name],...data,[]]);
 const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');
 const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=filename+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);alert('Thư viện Excel chưa tải được. Đã xuất CSV để mở bằng Excel.');
}

/* V30: per-list page sizes, preserving original data and click handlers. */
(function(){
 const root=document.getElementById('app');if(!root)return;
 const sizes=[10,20,50,100];let busy=false;
 const activeGroups=new WeakMap();
 function attachPager(parent,items,key){
   if(items.length<=10)return;
   if(parent.dataset.bstPagerReady===key)return;
   parent.dataset.bstPagerReady=key;
   const bar=document.createElement('div');bar.className='bst-pagebar';
   const lbl=document.createElement('label');lbl.textContent='Hiển thị';
   const select=document.createElement('select');select.setAttribute('aria-label','Số dòng hiển thị');
   sizes.forEach(n=>{const o=document.createElement('option');o.value=n;o.textContent=n;select.appendChild(o)});
   lbl.appendChild(select);
   const info=document.createElement('span');info.className='bst-pageinfo';
   const prev=document.createElement('button');prev.type='button';prev.textContent='‹';prev.setAttribute('aria-label','Trang trước');
   const next=document.createElement('button');next.type='button';next.textContent='›';next.setAttribute('aria-label','Trang sau');
   bar.append(lbl,info,prev,next);
   let page=0;
   const update=()=>{const limit=Number(select.value),max=Math.max(0,Math.ceil(items.length/limit)-1);page=Math.min(page,max);items.forEach((item,i)=>{item.hidden=i<page*limit||i>=(page+1)*limit});info.textContent=`${page*limit+1}–${Math.min(items.length,(page+1)*limit)} / ${items.length}`;prev.disabled=page===0;next.disabled=page===max};
   select.addEventListener('change',()=>{page=0;update()});prev.addEventListener('click',()=>{page--;update()});next.addEventListener('click',()=>{page++;update()});
   parent.after(bar);update();activeGroups.set(parent,{bar,items});
 }
 function scan(){
   if(busy)return;busy=true;
   try{
     root.querySelectorAll('table tbody').forEach(tbody=>{
       if(tbody.dataset.bstPagerReady)return;
       const rows=[...tbody.children].filter(el=>el.tagName==='TR');
       if(rows.length>10)attachPager(tbody.closest('.scroll')||tbody.closest('table'),rows,'table');
     });
     // Cards in the trade marketplace and community posts.
     root.querySelectorAll('.trade-market').forEach(section=>{
       if(section.dataset.bstPagerReady)return;
       const cards=[...section.children].filter(el=>el.classList.contains('trade-card'));
       if(cards.length>10)attachPager(section,cards,'cards');
     });
     root.querySelectorAll('.community-list').forEach(section=>{
       if(section.dataset.bstPagerReady)return;
       const cards=[...section.children].filter(el=>el.classList.contains('community-topic'));
       if(cards.length>10)attachPager(section,cards,'community');
     });
   }finally{busy=false}
 }
 let queued=false;
 const observer=new MutationObserver(()=>{if(queued)return;queued=true;requestAnimationFrame(()=>{queued=false;scan()})});
 observer.observe(root,{childList:true,subtree:true});
 scan();
})();
</script></body></html>
